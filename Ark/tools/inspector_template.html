<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Existence Inspector</title>
<style>
  :root {
    --surface: #ffffff; --panel: #f6f7f9; --ink: #1c2026; --ink-2: #4a525e; --ink-3: #6f7885; --rule: #dfe3e8; --grid: #e9ecf0;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --neutral: #8a929e;
    --good: #1c7c43; --warn: #a15c00; --bad: #c0362c; --idle: #6f7885;
    --good-bg: #e6f4ec; --warn-bg: #fbf0dc; --bad-bg: #fbe6e3; --idle-bg: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #14171c; --panel: #1b1f26; --ink: #e8ebf0; --ink-2: #b3bac5; --ink-3: #8a929e; --rule: #2c323b; --grid: #232830;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --neutral: #7c8591;
      --good: #58c48a; --warn: #e0a441; --bad: #f08379; --idle: #8a929e;
      --good-bg: #17301f; --warn-bg: #33270f; --bad-bg: #3a1c19; --idle-bg: #232830;
    }
  }
  :root[data-theme="dark"] {
    --surface: #14171c; --panel: #1b1f26; --ink: #e8ebf0; --ink-2: #b3bac5; --ink-3: #8a929e; --rule: #2c323b; --grid: #232830;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --neutral: #7c8591;
    --good: #58c48a; --warn: #e0a441; --bad: #f08379; --idle: #8a929e;
    --good-bg: #17301f; --warn-bg: #33270f; --bad-bg: #3a1c19; --idle-bg: #232830;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--surface); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.01em; }
  h2 { font-size: 18px; margin: 40px 0 4px; }
  h3 { font-size: 14px; margin: 0 0 2px; }
  p { margin: 0 0 10px; color: var(--ink-2); max-width: 86ch; }
  .lede { font-size: 15px; }
  .note { font-size: 12.5px; color: var(--ink-3); }
  code { font: 12.5px ui-monospace, Consolas, monospace; background: var(--panel); padding: 1px 4px; border-radius: 3px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; margin: 14px 0; }
  label.field { display: grid; gap: 3px; font-size: 12px; color: var(--ink-3); }
  select, button, input[type=text] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
  button { cursor: pointer; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; min-width: 0; }
  .card > .sub { font-size: 12.5px; color: var(--ink-3); margin: 0 0 8px; }
  .run-tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--rule); color: var(--ink-2); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
  .tile { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; }
  .tile b { display: block; font-size: 22px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .tile span { font-size: 12px; color: var(--ink-3); }
  .tile small { display: block; font-size: 12px; color: var(--ink-2); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--rule); vertical-align: top; font-size: 13px; }
  th { font-weight: 600; color: var(--ink-3); font-size: 12px; white-space: nowrap; }
  td.n, th.n { text-align: right; padding-right: 14px; white-space: nowrap; }
  td.n.wrap { white-space: normal; min-width: 170px; max-width: 300px; }
  table.compare td:first-child { min-width: 190px; }
  tr.group td { font-weight: 600; color: var(--ink-3); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; padding-top: 14px; border-bottom-color: var(--ink-3); }
  .status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 1px 8px 1px 6px; border-radius: 999px; white-space: nowrap; }
  .status.pass { color: var(--good); background: var(--good-bg); } .status.fail { color: var(--bad); background: var(--bad-bg); }
  .status.review { color: var(--warn); background: var(--warn-bg); } .status.not_exercised { color: var(--idle); background: var(--idle-bg); }
  .checks { display: grid; gap: 8px; margin: 8px 0 0; padding: 0; list-style: none; }
  .checks li { display: grid; grid-template-columns: 118px 1fr; gap: 10px; align-items: start; font-size: 13px; }
  .checks li div b { display: block; font-weight: 600; color: var(--ink); }
  .checks li div span { color: var(--ink-2); }
  .chart { position: relative; margin: 6px 0 2px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font: 11px system-ui, sans-serif; fill: var(--ink-3); }
  .chart .lab { fill: var(--ink-2); font-size: 11.5px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: 4px 0 0; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  .legend i.box { height: 10px; width: 10px; border-radius: 2px; }
  .legend i.dash { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; height: 2px; }
  .tip { position: absolute; pointer-events: none; z-index: 5; background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 9px;
    font-size: 12px; line-height: 1.45; box-shadow: 0 4px 14px rgba(0,0,0,.14); white-space: nowrap; display: none; }
  .tip b { font-weight: 600; } .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
  .lives { max-height: 440px; overflow: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); position: relative; }
  .lives canvas { display: block; }
  .empty { color: var(--ink-3); font-size: 13px; padding: 18px 0; }
  details { margin-top: 8px; } summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
  .delta-up { color: var(--good); } .delta-down { color: var(--bad); }
</style>
</head>
<body>
<main id="app"></main>
<script>window.INSPECTOR = /*INSPECTOR_DATA*/null;</script>
<script>
/*INSPECTOR_UI*/
</script>
</body>
</html>
