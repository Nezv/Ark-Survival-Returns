plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
def devRuntimeFile = file('config/dev-runtime.properties')
def devRuntime = new Properties()
devRuntimeFile.withInputStream { devRuntime.load(it) }
['clientHeap', 'serverHeap'].each { key ->
    if (!(devRuntime.getProperty(key) ==~ /[1-9][0-9]*[GM]/)) throw new GradleException("Invalid ${key} in dev-runtime.properties")
}
['renderDistance', 'simulationDistance'].each { key ->
    def value = devRuntime.getProperty(key).toInteger()
    if (value < 2 || value > 32) throw new GradleException("Invalid ${key} in dev-runtime.properties")
}
// Commit and uncommitted-change flag of the mod sources at launch; 'unknown' outside a git checkout.
def gitText = { List<String> arguments ->
    try {
        def run = providers.exec { commandLine(['git'] + arguments); ignoreExitValue = true }
        return run.result.get().exitValue == 0 ? run.standardOutput.asText.get().trim() : null
    } catch (Exception ignored) {
        return null
    }
}
def buildCommit = gitText(['rev-parse', 'HEAD']) ?: 'unknown'
def buildChanges = gitText(['status', '--porcelain', '--', 'src', 'build.gradle', 'gradle.properties'])
def buildDirty = buildChanges == null ? 'unknown' : buildChanges.isEmpty() ? 'false' : 'true'
// Presentation mods belong only to the interactive client, never datagen or a server.
sourceSets {
    immersiveClient { runtimeClasspath += sourceSets.main.runtimeClasspath }
}
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel', '.cache/**'
}
repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}
neoForge {
    version = project.neo_version
    runs {
        client {
            client(); sourceSet = sourceSets.immersiveClient; jvmArgument "-Xmx${project.findProperty('arkHeap') ?: devRuntime.clientHeap}"
            // Iris 1.11.2 returns a short binding array; dev GL validation assumes 16 slots.
            // Client-only workaround for https://github.com/IrisShaders/Iris/issues/3304.
            systemProperty 'neoforge.disableGlValidation', 'true'
            // A session recorded with nobody at the keyboard (tools/session_run.py): open this world at launch or
            // create a new one, let the scripted player walk, close the game when the recording is saved.
            if (project.hasProperty('arkWorld')) programArguments.addAll '--quickPlaySingleplayer', project.property('arkWorld').toString()
            if (project.hasProperty('arkFreshWorld')) systemProperty 'arksurvivalreturns.record.freshWorld', project.property('arkFreshWorld').toString()
            if (project.hasProperty('arkSeed')) systemProperty 'arksurvivalreturns.record.seed', project.property('arkSeed').toString()
            if (project.hasProperty('arkWorldType')) systemProperty 'arksurvivalreturns.record.worldType', project.property('arkWorldType').toString()
            if (project.hasProperty('arkAutopilot')) systemProperty 'arksurvivalreturns.autopilot', project.property('arkAutopilot').toString()
            if (project.hasProperty('arkQuit')) systemProperty 'arksurvivalreturns.record.quit', 'true'
            // A frame-time benchmark (tools/session_bench.py): the folder its measurements go to, and the setup's name.
            if (project.hasProperty('arkBenchmark')) systemProperty 'arksurvivalreturns.benchmark', project.property('arkBenchmark').toString()
            if (project.hasProperty('arkVariant')) systemProperty 'arksurvivalreturns.benchmark.variant', project.property('arkVariant').toString()
            if (project.hasProperty('arkSettle')) systemProperty 'arksurvivalreturns.benchmark.settle', project.property('arkSettle').toString()
            if (project.hasProperty('arkMobs')) systemProperty 'arksurvivalreturns.benchmark.mobs', project.property('arkMobs').toString()
            // Preparing the benchmark world: the biome its start is moved into, and the chunks Chunky generates around it.
            if (project.hasProperty('arkBiome')) systemProperty 'arksurvivalreturns.benchmark.biome', project.property('arkBiome').toString()
            if (project.hasProperty('arkPregen')) systemProperty 'arksurvivalreturns.benchmark.pregen', project.property('arkPregen').toString()
            // Who writes the creatures' cubes (client/draw): geckolib, allfaces or ark; and a self-check against GeckoLib.
            if (project.hasProperty('arkDraw')) systemProperty 'arksurvivalreturns.creatureDraw', project.property('arkDraw').toString()
            if (project.hasProperty('arkVerify')) systemProperty 'arksurvivalreturns.creatureDraw.verify', 'true'
            if (project.hasProperty('arkJfr')) jvmArgument "-XX:StartFlightRecording=filename=${project.property('arkJfr')},settings=profile"
        }
        server { server(); jvmArgument "-Xmx${devRuntime.serverHeap}"; programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'arksurvivalreturns.benchmarkNighttime', providers.gradleProperty('nighttimeBenchmark').getOrElse('false')
            systemProperty 'arksurvivalreturns.testPack', project.hasProperty('arkPack').toString()
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            // The session recorder stamps each recording with the code it ran on.
            systemProperty 'arksurvivalreturns.build.commit', buildCommit
            systemProperty 'arksurvivalreturns.build.dirty', buildDirty
        }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
    // The creature writer's parity test draws with GeckoLib's and Minecraft's own classes; no game is started.
    addModdingDependenciesTo sourceSets.test
}
// These projects are embedded in Ark Survival Returns. Keep any stale downloaded
// copies out of the runtime classpath so their mod containers cannot load twice.
def integratedStandaloneJars = [
    'AmbientSounds_*.jar',
    'CreativeCore_*.jar',
    'sound-physics-remastered-*.jar',
    'PresenceFootsteps*.jar',
    'Presence-Footsteps*.jar'
]
// -ParkPack runs against the branded pack that ships (python tools/build_pack.py) instead of the
// upstream downloads, so the exact jars in the Modrinth pack are what the dev run and GameTests load.
def useArkPack = project.hasProperty('arkPack')
if (useArkPack && !file('pack/out/mods').isDirectory()) {
    throw new GradleException('-ParkPack requires pack/out/mods; build the shipped pack with python tools/build_pack.py first.')
}
def installedPack = useArkPack
    ? fileTree(dir: 'pack/out/client-mods', include: ['*.jar'])
    : fileTree(dir: 'client-mods', include: ['*.jar'], exclude: integratedStandaloneJars)
// Client and server gameplay mods (survival journal stack). Loaded on every dev run.
def sharedPack = useArkPack
    ? fileTree(dir: 'pack/out/mods', include: ['Ark-*.jar'])
    : fileTree(dir: 'shared-mods', include: ['*.jar'])
// Sodium 0.9.2 (client-mods.lock.json) keeps its classes in a nested jar; the bulk vertex writer of
// client/draw/sodium is compiled against that one. Sodium stays optional at run time.
configurations { sodiumBundle { transitive = false } }
def sodiumClasses = tasks.register('extractSodiumClasses', Copy) {
    from({ zipTree(configurations.sodiumBundle.singleFile) }) {
        include 'META-INF/jarjar/*.jar'
        eachFile { it.path = it.name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('sodium-classes')
}
def sodiumApi = fileTree(layout.buildDirectory.dir('sodium-classes')) { include '*.jar'; builtBy sodiumClasses }
dependencies {
    sodiumBundle 'maven.modrinth:sodium:zg4YQ9EL'
    compileOnly sodiumApi
    testImplementation sodiumApi
    // Iris 1.11.4 (client-mods.lock.json): only its public API, to know the shadow pass and a shader pack in use.
    compileOnly 'maven.modrinth:iris:qE5Y7GrZ'
    implementation "maven.modrinth:geckolib:${geckolib_version}"
    implementation sharedPack
    compileOnly 'maven.modrinth:xaero-world-map-bridge:xvbOh80a'
    compileOnly 'maven.modrinth:xaeros-world-map:pKatKnls'
    // FancyMenu 3.9.12 and Konkrete 1.10.1 (client-mods.lock.json): the title screen's Ark creature element.
    compileOnly 'maven.modrinth:fancymenu:CcXZnQVp'
    compileOnly 'maven.modrinth:konkrete:S3KyS0Na'
    // BetterF3 18.0.2 (client-mods.lock.json): the Ark module of the debug screen.
    compileOnly 'maven.modrinth:betterf3:qX8kcwKf'
    immersiveClientRuntimeOnly installedPack
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Plain unit tests run without Minecraft; BehaviorModels exports with Gson (Minecraft's version).
    testImplementation 'com.google.code.gson:gson:2.13.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform() }

// The reviewed showcase designs are the only authored workstation data and frame assets.
def phaseABenches = ['armoury', 'working_station', 'mortar_and_pestle', 'medicine_bench', 'smithing_table', 'saddlery']
def workstationBuild = layout.buildDirectory.dir('workstations')
tasks.register('generateWorkstationData', Exec) {
    dependsOn 'createMinecraftArtifacts'
    inputs.dir 'design/workstations'
    inputs.files 'tools/workstation_plan.py', 'tools/build_workstation_data.py', 'tools/build_workstation_crests.py', 'tools/stone_symbols.py', 'tools/showcase_recipes.py',
            'src/main/java/dev/nez/arksurvivalreturns/feature/theme/ThemePolicy.java',
            'src/main/java/dev/nez/arksurvivalreturns/feature/primitive/PrimitiveEvents.java'
    inputs.dir 'src/generated/resources/data/arksurvivalreturns'
    inputs.files 'src/generated/resources/assets/minecraft/lang/en_us.json', 'src/generated/resources/assets/arksurvivalreturns/lang/en_us.json'
    outputs.dir workstationBuild
    commandLine 'python', 'tools/build_workstation_data.py', workstationBuild.get().asFile.absolutePath
}
tasks.named('processResources') {
    dependsOn 'generateWorkstationData'
    from('design/workstations') {
        include phaseABenches.collect { it + '.json' }
        into 'data/arksurvivalreturns/workstation'
    }
    from('design/workstations') {
        include 'graph_style.json'
        into 'assets/arksurvivalreturns/workstation'
    }
    from('design/workstations/crests') {
        include phaseABenches.collect { it + '.png' }
        into 'assets/arksurvivalreturns/textures/gui/workstation'
    }
    from(workstationBuild.map { it.dir('resources') })
}
tasks.named('test') {
    dependsOn 'generateWorkstationData'
    workingDir projectDir
}
def clientPackClasspath = neoForge.runs.client.sourceSet.get().runtimeClasspath
def serverPackClasspath = neoForge.runs.gameTestServer.sourceSet.get().runtimeClasspath
tasks.register('verifyClientPack') {
    group = 'verification'
    description = 'Checks that presentation mods load only with the client and shared gameplay mods load on both sides.'
    inputs.files(clientPackClasspath, serverPackClasspath, installedPack, sharedPack)
    doLast {
        def clientFiles = clientPackClasspath.files
        def serverFiles = serverPackClasspath.files
        installedPack.files.each { artifact ->
            if (!clientFiles.contains(artifact)) throw new GradleException("Missing client dependency: ${artifact.name}")
            if (serverFiles.contains(artifact)) throw new GradleException("Client dependency leaked into server: ${artifact.name}")
        }
        sharedPack.files.each { artifact ->
            if (!clientFiles.contains(artifact)) throw new GradleException("Missing shared dependency on client: ${artifact.name}")
            if (!serverFiles.contains(artifact)) throw new GradleException("Missing shared dependency on server: ${artifact.name}")
        }
        logger.lifecycle("Verified ${installedPack.files.size()} presentation mods on client classpath only and ${sharedPack.files.size()} shared mods on both sides.")
    }
}
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var properties = [minecraft_version_range: minecraft_version_range, neo_version: neo_version,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
idea { module { downloadSources = true; downloadJavadoc = true } }

// List the reviewed dev dependencies before launch, and verify active pins locally.
def devManifest = file('config/dev-dependencies.json')
def clientManifest = file('config/client-mods.lock.json')
def sharedManifest = file('config/shared-mods.lock.json')
tasks.register('verifyDevDependencies') {
    group = 'verification'
    description = 'Lists the dev-run dependencies and verifies every pinned artifact and checksum.'
    inputs.files(devManifest, clientManifest, sharedManifest, installedPack, sharedPack)
    doLast {
        def plan = new groovy.json.JsonSlurper().parse(devManifest)
        def pins = [clientManifest, sharedManifest].collectMany { new groovy.json.JsonSlurper().parse(it).entries }
        plan.dependencies.each { dependency ->
            if (dependency.status == 'pinned') {
                def pin = pins.find { it.project == dependency.project }
                if (pin == null) throw new GradleException("Missing dependency pin: ${dependency.project}")
                def folder = pin.kind == 'shader' ? 'run/shaderpacks' : (pin.kind == 'shared' ? 'shared-mods' : 'client-mods')
                def artifact = new File(devManifest.parentFile.parentFile, "${folder}/${pin.filename}")
                if (!artifact.isFile()) throw new GradleException("Missing ${pin.filename}; run Install-Ark-Extras.bat")
                def actual = java.security.MessageDigest.getInstance('SHA-512').digest(artifact.bytes).encodeHex().toString()
                if (!actual.equalsIgnoreCase(pin.sha512)) throw new GradleException("Checksum mismatch: ${pin.filename}")
                logger.lifecycle("Dev dependency: ${dependency.project} ${pin.version} [${dependency.scope}, verified]")
            } else logger.lifecycle("Dev dependency: ${dependency.project} [${dependency.status}] ${dependency.reason}")
        }
    }
}
def devOptions = file('run/options.txt')
def devServerProperties = file('run/server.properties')
def questSource = file('config/ftbquests')
def questTarget = file('run/config/ftbquests')
def menuSource = file('config/fancymenu')
def menuTarget = file('run/config/fancymenu')
tasks.register('prepareDevRuntime') {
    group = 'application'
    description = 'Applies explicit dev distances and syncs the authored quest pack into the instance config.'
    inputs.file(devRuntimeFile)
    inputs.property('arkRenderDistance', (project.findProperty('arkRenderDistance') ?: '').toString())
    if (questSource.isDirectory()) inputs.dir(questSource)
    if (menuSource.isDirectory()) inputs.dir(menuSource)
    outputs.files(devOptions, devServerProperties)
    doLast {
        def settings = new Properties()
        devRuntimeFile.withInputStream { settings.load(it) }
        def update = { File target, String separator, Map values ->
            target.parentFile.mkdirs()
            def lines = target.exists() ? target.readLines('UTF-8') : []
            values.each { key, value ->
                lines.removeAll { it.startsWith(key + separator) }
                lines.add(key + separator + value)
            }
            target.setText(lines.join('\n') + '\n', 'UTF-8')
        }
        // -ParkRenderDistance: one launch at another render distance (tools/session_bench.py), the file's value kept.
        update(devOptions, ':', [renderDistance:inputs.properties.arkRenderDistance ?: settings.renderDistance,simulationDistance:settings.simulationDistance])
        update(devServerProperties, '=', ['view-distance':settings.renderDistance, 'simulation-distance':settings.simulationDistance])
        // FTB Quests reads its pack from the instance config folder, never from a data pack.
        if (questSource.isDirectory()) {
            questSource.eachFileRecurse { sourceFile ->
                if (sourceFile.isFile()) {
                    def relative = questSource.toPath().relativize(sourceFile.toPath()).toString()
                    def target = new File(questTarget, relative)
                    target.parentFile.mkdirs()
                    target.bytes = sourceFile.bytes
                }
            }
            logger.lifecycle('Synced the authored quest pack into run/config/ftbquests.')
        }
        // FancyMenu reads layouts from the instance config too; only the authored files are overwritten.
        if (menuSource.isDirectory()) {
            menuSource.eachFileRecurse { sourceFile ->
                if (sourceFile.isFile()) {
                    def target = new File(menuTarget, menuSource.toPath().relativize(sourceFile.toPath()).toString())
                    target.parentFile.mkdirs()
                    target.bytes = sourceFile.bytes
                }
            }
            logger.lifecycle('Synced the authored FancyMenu layouts into run/config/fancymenu.')
        }
    }
}
tasks.named('runClient') { dependsOn 'verifyDevDependencies', 'verifyClientPack', 'prepareDevRuntime' }
// Seed client settings once, so later shader choices and in-game adjustments survive launches.
def shaderDefaults = file('config/client-defaults')
def shaderRunDirectory = file('run')
tasks.register('prepareClientShaders') {
    group = 'application'
    description = 'Seeds missing Iris and Bliss prehistoric defaults without replacing user settings.'
    doLast {
        shaderDefaults.eachFileRecurse { source ->
            if (source.isFile()) {
                def target = new File(shaderRunDirectory, shaderDefaults.toPath().relativize(source.toPath()).toString())
                if (!target.exists()) {
                    target.parentFile.mkdirs()
                    target.bytes = source.bytes
                }
            }
        }
    }
}
tasks.named('prepareClientRun') { dependsOn 'prepareClientShaders' }
tasks.named('runServer') { dependsOn 'prepareDevRuntime' }
tasks.named('runGameTestServer') { dependsOn 'prepareDevRuntime' }
