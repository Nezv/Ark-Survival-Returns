[progression]
	#Require the saved map entitlement. Disabled during development while taming is unavailable; restart/rejoin after changing.
	mapRequiresUnlock = false
	#Scale of repeating equal-area danger regions; tile period is four times this value. Saved per world. Legacy key retained for existing configs.
	# Default: 256
	# Range: 96 ~ 1024
	bandWidth = 256

[movement]
	#Normal player sprint benchmark in blocks/second; does not chase temporary player potion buffs.
	# Default: 5.612
	# Range: 1.0 ~ 20.0
	playerSprintBlocksPerSecond = 5.612

	[movement.pteranodon]
		#Full pursuit speed relative to the player benchmark; normal wandering uses a slower gait.
		# Default: 0.85
		# Range: 0.2 ~ 4.0
		sprintRatio = 0.85
		#Fraction of land speed retained while swimming.
		# Default: 0.65
		# Range: 0.1 ~ 1.5
		waterRetention = 0.65
		#Visual stride length multiplier; larger values slow the animation at the same ground speed.
		# Default: 1.0
		# Range: 0.5 ~ 2.0
		strideScale = 1.0

