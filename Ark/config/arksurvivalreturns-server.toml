[spawning]
	#Enable natural creature spawns. Spawn eggs and commands still work.
	enabled = true
	#Maximum Ark creatures within 96 blocks. Independent of vanilla animal caps.
	# Default: 24
	# Range: 1 ~ 128
	localCap = 24
	#Minimum distance between naturally spawning large creatures.
	# Default: 24
	# Range: 16 ~ 128
	solitarySpacing = 24
	#Target minimum wild groups per player within 96 blocks; retries when safe loaded ground is unavailable.
	# Default: 3
	# Range: 1 ~ 20
	minimumGroups = 3
	#Ticks between population checks (20 ticks = 1 second).
	# Default: 100
	# Range: 20 ~ 1200
	checkIntervalTicks = 100
	#Maximum groups added across a dimension per check; players are served round-robin.
	# Default: 2
	# Range: 1 ~ 8
	groupsPerPass = 2

